# main ブランチに push するたびに、ブラウザ版をビルドして GitHub Pages に公開する
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # アプリに含まれない文書だけの変更では、公開し直さない。
    # README.md は「使い方」タブに表示する(src/ui/helpView.ts)ので、ここに入れない
    paths-ignore:
      - 'ABOUT.md'
      - 'AGENTS.md'
      - 'CHANGELOG.md'
      - 'CLAUDE.md'
      - 'DEVELOPMENT.md'
      - 'TODO.md'
      - 'docs/images/README.md'
      - 'fixtures/README.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # Electron 本体(約 100MB)はブラウザ版のビルドに要らないので、ダウンロードしない
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
